name: Build & Release Multi-APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Create Dummy Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      
      - name: Build Multi-APK with Gradle
        run: ./gradlew assembleDebug

      - name: Organize & Rename APKs
        id: rename_apks
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"
          cd app/build/outputs/apk/debug/
          
          for apk in *.apk; do
            if [[ "$apk" == *"universal"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-universal.apk"
            elif [[ "$apk" == *"arm64-v8a"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-arm64-v8a.apk"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-armeabi-v7a.apk"
            elif [[ "$apk" == *"x86_64"* ]]; then
              new_name="AetherST-Tunnel-${TAG_NAME}-x86_64.apk"
            else
              new_name="AetherST-Tunnel-${TAG_NAME}-$(echo $apk | rev | cut -d'-' -f2 | rev).apk"
            fi
            cp "$apk" "$RELEASE_DIR/$new_name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
